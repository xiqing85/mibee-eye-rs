name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl,x86_64-unknown-linux-musl

      - name: Install cargo-zigbuild + zig
        run: |
          pip3 install --user ziglang
          cargo install --locked cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build (aarch64 gnu + musl, x86_64 musl; v4l2-encoder + ai)
        run: |
          for t in aarch64-unknown-linux-gnu aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            cargo zigbuild --release --features v4l2-encoder,ai --target "$t"
          done

      - name: Package
        run: |
          rm -f checksums.txt
          for t in aarch64-unknown-linux-gnu aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            case "$t" in
              aarch64-unknown-linux-gnu)  arch=arm64 ;;
              aarch64-unknown-linux-musl) arch=arm64-musl ;;
              x86_64-unknown-linux-musl)  arch=amd64-musl ;;
            esac
            DIR="mibee-eye-raspi-rs-${GITHUB_REF_NAME}.linux-${arch}"
            mkdir -p "${DIR}/deploy"
            cp "target/${t}/release/mibee-eye-raspi-rs" "${DIR}/"
            cp config.example.toml "${DIR}/"
            cp deploy/mibee-eye-raspi-rs.service "${DIR}/deploy/"
            cp LICENSE NOTICE "${DIR}/"
            tar czf "${DIR}.tar.gz" "${DIR}"
            sha256sum "${DIR}.tar.gz" >> checksums.txt
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            mibee-eye-raspi-rs-*.tar.gz \
            checksums.txt \
            --title "MiBee Eye (Rust) ${GITHUB_REF_NAME}" \
            --notes "MiBee Eye (蜂眼) Rust release / 版本发布。Full notes below. 完整发布说明见下文。"
