name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo hygiene gate (junk/secret files must not be tracked)
        run: tools/check-repo-hygiene.sh

  hardcode:
    # 硬编码门禁（2026-09-15 规范）：应配置化的值不得硬编码——设备路径、
    # IP、版本串、国标 ID、外部可执行名；默认值只在配置模块声明。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hardcoded-value gate (values must be configurable)
        run: tools/check-hardcode.sh

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt --check

  # Every optional feature must stay compilable. The storage backends once
  # rotted for months because CI only exercised default features.
  all-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - name: Clippy (all features, all targets)
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Test (storage backends)
        run: cargo test --features storage-webdav,storage-s3,storage-smb

  identity:
    # 身份门禁（2026-09-27）：公开历史只允许已验证的 xiqing85 noreply 身份
    # （324791119）。捏造的 noreply 数字 ID 曾把陌生账号挂上贡献者列表。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity allowlist (verified xiqing85 noreply only)
        run: |
          ok="324791119+xiqing85@users.noreply.github.com"
          viol=$(git log --format="%ae%n%(trailers:key=Co-authored-by,valueonly)" \
            | grep -oE "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+" | sort -u \
            | grep -vxF -e "$ok"  || true)
          violc=$(git log --format="%ce" \
            | grep -oE "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+" | sort -u \
            | grep -vxF -e "$ok" -e "noreply@github.com" || true)
          if [ -n "$viol$violc" ]; then
            echo "::error::Non-allowlisted identity emails — author/trailer [$viol] committer [$violc]"
            exit 1
          fi
